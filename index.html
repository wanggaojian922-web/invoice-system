<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <title>扫码开票系统</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- QRCode -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        #qrcodePage,
        #formPage,
        #adminPage {
            display: none;
        }

        #qrcode {
            text-align: center;
            margin: 20px 0;
        }

        #qrcode img {
            max-width: 300px;
            border: 10px solid #fff;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.12);
        }

        .tip-text {
            color: #777;
            margin-top: 10px;
        }

        .table-responsive {
            max-height: 500px;
            overflow-y: auto;
        }

        .loading-text {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- 二维码页 -->
    <div class="container" id="qrcodePage">

        <div class="card">

            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">扫码开票系统</h4>
            </div>

            <div class="card-body">

                <div id="qrcode"></div>

                <p class="text-center tip-text">
                    微信扫码即可填写开票信息
                </p>

                <div class="d-grid gap-2 mt-4">

                    <button class="btn btn-success"
                        onclick="showAdmin()">
                        进入后台管理
                    </button>

                    <button class="btn btn-outline-secondary"
                        onclick="location.reload()">
                        刷新页面
                    </button>

                    <button class="btn btn-outline-primary"
                        onclick="showForm()">
                        手动进入表单
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- 表单页 -->
    <div class="container" id="formPage">

        <div class="card">

            <div class="card-header bg-info text-white text-center">
                <h4 class="mb-0">发票开具申请</h4>
            </div>

            <div class="card-body">

                <form id="invoiceForm">

                    <div class="mb-3">
                        <label class="form-label">购物日期</label>
                        <input type="date"
                            class="form-control"
                            id="buyDate"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">订单号</label>
                        <input type="text"
                            class="form-control"
                            id="orderNo"
                            placeholder="请输入订单号"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">开票类型</label>

                        <select class="form-select"
                            id="invoiceType"
                            required>

                            <option value="">请选择</option>

                            <option value="专票">
                                增值税专用发票
                            </option>

                            <option value="普票">
                                增值税普通发票
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">开票抬头</label>

                        <input type="text"
                            class="form-control"
                            id="invoiceTitle"
                            placeholder="请输入开票抬头"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">税号</label>

                        <input type="text"
                            class="form-control"
                            id="taxNo"
                            placeholder="请输入纳税人识别号"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">联系电话</label>

                        <input type="tel"
                            class="form-control"
                            id="phone"
                            placeholder="请输入联系电话"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">邮箱</label>

                        <input type="email"
                            class="form-control"
                            id="email"
                            placeholder="请输入邮箱"
                            required>
                    </div>

                    <button type="submit"
                        class="btn btn-primary w-100">
                        提交开票信息
                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- 后台页 -->
    <div class="container" id="adminPage">

        <div class="card">

            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">

                <h5 class="mb-0">开票后台管理</h5>

                <button class="btn btn-light btn-sm"
                    onclick="showQrcode()">
                    返回首页
                </button>

            </div>

            <div class="card-body">

                <div class="mb-3">

                    <button class="btn btn-success"
                        onclick="exportToExcel()">
                        导出 Excel
                    </button>

                    <button class="btn btn-danger ms-2"
                        onclick="clearAllData()">
                        清空全部数据
                    </button>

                    <button class="btn btn-primary ms-2"
                        onclick="renderTable()">
                        刷新数据
                    </button>

                </div>

                <div class="table-responsive">

                    <table class="table table-bordered table-striped">

                        <thead class="table-light">

                            <tr>
                                <th>序号</th>
                                <th>购物日期</th>
                                <th>订单号</th>
                                <th>开票类型</th>
                                <th>抬头</th>
                                <th>税号</th>
                                <th>电话</th>
                                <th>邮箱</th>
                            </tr>

                        </thead>

                        <tbody id="dataTable"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <script>

        // =========================
        // Supabase 配置
        // =========================

        const SUPABASE_URL =
            'https://qbbisgeqsyckfkcqbbjg.supabase.co';

        // 替换成你自己的 publishable key
        const SUPABASE_KEY =
            '在这里粘贴你的 sb_publishable_xxx';

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        // =========================
        // 页面初始化
        // =========================

        window.onload = function () {

            const searchStr =
                window.location.search;

            if (searchStr.includes('form=1')) {

                showForm();

            } else {

                showQrcode();

                createQrcode();
            }
        };

        // =========================
        // 创建二维码
        // =========================

        function createQrcode() {

            const baseUrl =
                window.location.origin +
                window.location.pathname;

            const link =
                baseUrl + '?form=1';

            QRCode.toDataURL(
                link,
                {
                    width: 320,
                    margin: 1
                },
                function (err, imgUrl) {

                    if (err) {

                        console.error(err);

                        return;
                    }

                    document.getElementById('qrcode').innerHTML =
                        `<img src="${imgUrl}" alt="二维码">`;
                }
            );
        }

        // =========================
        // 提交表单
        // =========================

        document
            .getElementById('invoiceForm')
            .addEventListener('submit', async function (e) {

                e.preventDefault();

                const formData = {

                    buy_date:
                        document.getElementById('buyDate').value,

                    order_no:
                        document.getElementById('orderNo').value,

                    invoice_type:
                        document.getElementById('invoiceType').value,

                    invoice_title:
                        document.getElementById('invoiceTitle').value,

                    tax_no:
                        document.getElementById('taxNo').value,

                    phone:
                        document.getElementById('phone').value,

                    email:
                        document.getElementById('email').value
                };

                const { error } =
                    await supabaseClient
                        .from('invoice_data')
                        .insert([formData]);

                if (error) {

                    console.error(error);

                    alert('提交失败：' + error.message);

                    return;
                }

                alert('提交成功！');

                this.reset();
            });

        // =========================
        // 加载数据
        // =========================

        async function renderTable() {

            const tbody =
                document.getElementById('dataTable');

            tbody.innerHTML =
                `<tr>
                    <td colspan="8"
                        class="loading-text">
                        数据加载中...
                    </td>
                </tr>`;

            const { data, error } =
                await supabaseClient
                    .from('invoice_data')
                    .select('*')
                    .order('id', {
                        ascending: false
                    });

            if (error) {

                console.error(error);

                tbody.innerHTML =
                    `<tr>
                        <td colspan="8"
                            class="loading-text">
                            数据加载失败
                        </td>
                    </tr>`;

                return;
            }

            tbody.innerHTML = '';

            if (data.length === 0) {

                tbody.innerHTML =
                    `<tr>
                        <td colspan="8"
                            class="loading-text">
                            暂无数据
                        </td>
                    </tr>`;

                return;
            }

            data.forEach((item, idx) => {

                const tr =
                    document.createElement('tr');

                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${item.buy_date || ''}</td>
                    <td>${item.order_no || ''}</td>
                    <td>${item.invoice_type || ''}</td>
                    <td>${item.invoice_title || ''}</td>
                    <td>${item.tax_no || ''}</td>
                    <td>${item.phone || ''}</td>
                    <td>${item.email || ''}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        // =========================
        // 导出 Excel
        // =========================

        async function exportToExcel() {

            const { data, error } =
                await supabaseClient
                    .from('invoice_data')
                    .select('*')
                    .order('id', {
                        ascending: false
                    });

            if (error || !data || data.length === 0) {

                alert('暂无数据');

                return;
            }

            const exportArr =
                data.map((item, idx) => ({

                    "序号": idx + 1,

                    "购物日期": item.buy_date,

                    "订单号": item.order_no,

                    "开票类型": item.invoice_type,

                    "开票抬头": item.invoice_title,

                    "税号": item.tax_no,

                    "联系电话": item.phone,

                    "邮箱": item.email
                }));

            const sheet =
                XLSX.utils.json_to_sheet(exportArr);

            const workbook =
                XLSX.utils.book_new();

            XLSX.utils.book_append_sheet(
                workbook,
                sheet,
                '开票数据'
            );

            XLSX.writeFile(
                workbook,
                `开票数据_${new Date().toLocaleDateString()}.xlsx`
            );
        }

        // =========================
        // 清空数据
        // =========================

        async function clearAllData() {

            if (!confirm('确定清空所有数据吗？'))
                return;

            const { error } =
                await supabaseClient
                    .from('invoice_data')
                    .delete()
                    .neq('id', 0);

            if (error) {

                console.error(error);

                alert('删除失败');

                return;
            }

            alert('数据已清空');

            renderTable();
        }

        // =========================
        // 页面切换
        // =========================

        function showQrcode() {

            document.getElementById('qrcodePage')
                .style.display = 'block';

            document.getElementById('formPage')
                .style.display = 'none';

            document.getElementById('adminPage')
                .style.display = 'none';
        }

        function showForm() {

            document.getElementById('qrcodePage')
                .style.display = 'none';

            document.getElementById('formPage')
                .style.display = 'block';

            document.getElementById('adminPage')
                .style.display = 'none';
        }

        function showAdmin() {

            document.getElementById('qrcodePage')
                .style.display = 'none';

            document.getElementById('formPage')
                .style.display = 'none';

            document.getElementById('adminPage')
                .style.display = 'block';

            renderTable();
        }

    </script>

</body>

</html>
